<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HonesTech Mobile Mechanic — Tool Access</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap');

  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --yellow:#f5c518;
    --yellow-dim:#8a7317;
    --text:#eaeaea;
    --text-dim:#8a8a8a;
    --danger:#e6553a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .wrap{
    width:100%;
    max-width:420px;
    padding:32px 20px 48px;
    text-align:center;
  }
  .logo{
    width:74px; height:74px;
    margin:0 auto 10px;
    border-radius:14px;
    overflow:hidden;
    border:2px solid var(--yellow-dim);
  }
  .logo img{width:100%; height:100%; object-fit:cover; display:block;}
  h1{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:19px;
    margin:6px 0 2px;
    color:var(--text);
  }
  .sub{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:34px;
  }

  /* --- PADLOCK --- */
  .lock-stage{
    position:relative;
    width:260px;
    height:290px;
    margin:0 auto 26px;
  }
  .shackle{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:120px;
    height:110px;
    border:22px solid #b9b9b9;
    border-bottom:none;
    border-radius:60px 60px 0 0;
    background:transparent;
    transition: transform 0.6s cubic-bezier(.34,1.56,.64,1), opacity 0.4s ease;
    z-index:1;
  }
  .lock-stage.unlocked .shackle{
    transform:translateX(-50%) translateY(-46px) rotate(-28deg);
  }
  .body{
    position:absolute;
    bottom:0; left:0; right:0;
    height:190px;
    background:linear-gradient(180deg,#2c2c2e,#1c1c1e);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    border:1px solid #333;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 14px 14px;
    z-index:2;
    transition: box-shadow 0.4s ease;
  }
  .lock-stage.unlocked .body{
    box-shadow:0 10px 30px rgba(245,197,24,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .status-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--danger);
    margin-bottom:14px;
    box-shadow:0 0 8px rgba(230,85,58,0.7);
    transition: all 0.3s ease;
  }
  .lock-stage.unlocked .status-dot{
    background:var(--yellow);
    box-shadow:0 0 10px rgba(245,197,24,0.8);
  }
  .dials{
    display:flex;
    gap:10px;
    background:#0f0f10;
    border-radius:10px;
    padding:10px 12px;
    border:1px solid #000;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);
  }
  .dial{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .dial button{
    width:34px; height:26px;
    background:#232324;
    border:1px solid #3a3a3c;
    color:var(--yellow);
    font-size:14px;
    border-radius:6px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition: background 0.15s ease;
  }
  .dial button:active{ background:#3a3a3c; }
  .dial-window{
    width:52px;
    height:60px;
    background:#000;
    border-radius:6px;
    border:1px solid #333;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:24px;
    color:var(--yellow);
    letter-spacing:1px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.8);
  }
  .hint{
    margin-top:14px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.3px;
  }

  .msg{
    min-height:20px;
    font-size:13px;
    margin-bottom:10px;
    color:var(--danger);
    font-weight:600;
  }
  .msg.success{ color:var(--yellow); }

  .btn{
    background:var(--yellow);
    color:#111;
    border:none;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
    font-size:14px;
    padding:13px 26px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    max-width:260px;
    -webkit-tap-highlight-color:transparent;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{
    background:#3a3a3c;
    color:#777;
    cursor:default;
  }

  /* --- UNLOCKED PANEL --- */
  .tools{
    display:none;
    margin-top:8px;
    animation:fadeUp 0.5s ease forwards;
  }
  .tools.show{ display:block; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .tool-link{
    display:block;
    background:var(--panel);
    border:1px solid #2a2a2a;
    border-left:4px solid var(--yellow);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
    text-align:left;
    text-decoration:none;
    color:var(--text);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tool-link:active{ transform:scale(0.98); }
  .tool-link:hover{ background:#1c1c1c; }
  .tool-name{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:15px;
    color:var(--yellow);
    margin-bottom:3px;
  }
  .tool-desc{
    font-size:12.5px;
    color:var(--text-dim);
  }
  footer{
    margin-top:30px;
    font-size:11px;
    color:#555;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo"><img src="https://i.postimg.cc/YCyfQcDp/IMG-8479.png" alt="HonesTech logo"></div>
  <h1>HonesTech Mobile Mechanic</h1>
  <div class="sub">Internal Tool Access</div>

  <div id="lockStage" class="lock-stage">
    <div class="shackle"></div>
    <div class="body">
      <div class="status-dot"></div>
      <div class="dials">
        <div class="dial">
          <button onclick="bump(0,1)">▲</button>
          <div class="dial-window" id="d0">00</div>
          <button onclick="bump(0,-1)">▼</button>
        </div>
        <div class="dial">
          <button onclick="bump(1,1)">▲</button>
          <div class="dial-window" id="d1">00</div>
          <button onclick="bump(1,-1)">▼</button>
        </div>
        <div class="dial">
          <button onclick="bump(2,1)">▲</button>
          <div class="dial-window" id="d2">00</div>
          <button onclick="bump(2,-1)">▼</button>
        </div>
      </div>
      <div class="hint">Enter the 3-number combination</div>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <button class="btn" id="unlockBtn" onclick="tryUnlock()">Unlock</button>

  <div class="tools" id="tools">
    <a class="tool-link" href="https://honestechmobilemechanic.com/ppi.html">
      <div class="tool-name">Pre-Purchase Inspection Tool</div>
      <div class="tool-desc">Full vehicle inspection checklist for PPI jobs</div>
    </a>
  </div>

  <footer>HonesTech Mobile Mechanic &middot; Middlesex County, NJ</footer>
</div>

<script>
  // Combination: 1 - 35 - 15 (classic 0-39 dial range)
  var CODE = [1, 35, 15];
  var vals = [0, 0, 0];
  var MAX = 39;

  function pad(n){
    n = ((n % (MAX+1)) + (MAX+1)) % (MAX+1);
    return (n < 10 ? "0" : "") + n;
  }

  function render(){
    document.getElementById('d0').textContent = pad(vals[0]);
    document.getElementById('d1').textContent = pad(vals[1]);
    document.getElementById('d2').textContent = pad(vals[2]);
  }

  function bump(idx, dir){
    vals[idx] = ((vals[idx] + dir) % (MAX+1) + (MAX+1)) % (MAX+1);
    render();
    document.getElementById('msg').textContent = '';
    document.getElementById('msg').className = 'msg';
  }

  function tryUnlock(){
    var msg = document.getElementById('msg');
    var correct = (vals[0] === CODE[0] && vals[1] === CODE[1] && vals[2] === CODE[2]);

    if(correct){
      msg.textContent = 'Correct combination — unlocked.';
      msg.className = 'msg success';
      document.getElementById('lockStage').classList.add('unlocked');
      document.getElementById('unlockBtn').style.display = 'none';
      setTimeout(function(){
        document.getElementById('tools').classList.add('show');
      }, 400);
    } else {
      msg.textContent = 'Incorrect combination. Try again.';
      msg.className = 'msg';
      var stage = document.getElementById('lockStage');
      stage.style.transform = 'translateX(-6px)';
      setTimeout(function(){ stage.style.transform = 'translateX(6px)'; }, 80);
      setTimeout(function(){ stage.style.transform = 'translateX(0)'; }, 160);
    }
  }

  render();
</script>

</body>
</html>
