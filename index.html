<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HonesTech Mobile Mechanic — Tool Access</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap');

  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --yellow:#f5c518;
    --yellow-dim:#8a7317;
    --text:#eaeaea;
    --text-dim:#8a8a8a;
    --danger:#e6553a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .wrap{
    width:100%;
    max-width:420px;
    padding:32px 20px 48px;
    text-align:center;
  }
  .logo{
    width:74px; height:74px;
    margin:0 auto 10px;
    border-radius:14px;
    overflow:hidden;
    border:2px solid var(--yellow-dim);
  }
  .logo img{width:100%; height:100%; object-fit:cover; display:block;}
  h1{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:19px;
    margin:6px 0 2px;
    color:var(--text);
  }
  .sub{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:34px;
  }

  /* --- KEYPAD --- */
  .pad-stage{
    width:280px;
    margin:0 auto 24px;
  }
  .panel{
    background:linear-gradient(180deg,#232324,#151516);
    border-radius:18px;
    border:1px solid #333;
    box-shadow:0 12px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    padding:20px 20px 24px;
  }
  .panel-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:14px;
  }
  .status-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 8px rgba(230,85,58,0.7);
    transition: all 0.3s ease;
  }
  .pad-stage.unlocked .status-dot{
    background:var(--yellow);
    box-shadow:0 0 10px rgba(245,197,24,0.8);
  }
  .panel-label{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:11px;
    color:var(--text-dim);
  }
  .display{
    display:flex;
    justify-content:center;
    gap:10px;
    background:#000;
    border-radius:8px;
    border:1px solid #333;
    padding:14px 10px;
    margin-bottom:16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.7);
  }
  .display .digit{
    width:14px; height:20px;
    border-radius:2px;
    background:#1a1a1a;
    color:var(--yellow);
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    text-align:center;
    line-height:20px;
    text-shadow:0 0 6px rgba(245,197,24,0.6);
  }
  .display .digit.empty{ color:#2a2a2a; text-shadow:none; }
  .keys{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
  }
  .key{
    background:#2a2a2c;
    border:1px solid #3a3a3c;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:19px;
    border-radius:10px;
    padding:14px 0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition: background 0.12s ease, transform 0.08s ease;
  }
  .key:active{ background:#3a3a3c; transform:scale(0.96); }
  .key.fn{
    font-family:'Inter',sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--text-dim);
  }
  .key.enter{
    background:var(--yellow);
    color:#111;
    font-weight:700;
  }
  .key.enter:active{ background:#d9ac0f; }
  .hint{
    margin-top:14px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.3px;
    text-align:center;
  }

  .msg{
    min-height:20px;
    font-size:13px;
    margin-bottom:10px;
    color:var(--danger);
    font-weight:600;
  }
  .msg.success{ color:var(--yellow); }

  .btn{
    background:var(--yellow);
    color:#111;
    border:none;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
    font-size:14px;
    padding:13px 26px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    max-width:260px;
    -webkit-tap-highlight-color:transparent;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:disabled{
    background:#3a3a3c;
    color:#777;
    cursor:default;
  }

  /* --- UNLOCKED PANEL --- */
  .tools{
    display:none;
    margin-top:8px;
    animation:fadeUp 0.5s ease forwards;
  }
  .tools.show{ display:block; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .tool-link{
    display:block;
    background:var(--panel);
    border:1px solid #2a2a2a;
    border-left:4px solid var(--yellow);
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
    text-align:left;
    text-decoration:none;
    color:var(--text);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tool-link:active{ transform:scale(0.98); }
  .tool-link:hover{ background:#1c1c1c; }
  .tool-name{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    font-size:15px;
    color:var(--yellow);
    margin-bottom:3px;
  }
  .tool-desc{
    font-size:12.5px;
    color:var(--text-dim);
  }
  footer{
    margin-top:30px;
    font-size:11px;
    color:#555;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="logo"><img src="https://i.postimg.cc/YCyfQcDp/IMG-8479.png" alt="HonesTech logo"></div>
  <h1>HonesTech Mobile Mechanic</h1>
  <div class="sub">Internal Tool Access</div>

  <div id="lockStage" class="pad-stage">
    <div class="panel">
      <div class="panel-top">
        <div class="status-dot"></div>
        <div class="panel-label">Enter Access Code</div>
      </div>
      <div class="display" id="display">
        <div class="digit empty" id="dg0">•</div>
        <div class="digit empty" id="dg1">•</div>
        <div class="digit empty" id="dg2">•</div>
        <div class="digit empty" id="dg3">•</div>
        <div class="digit empty" id="dg4">•</div>
        <div class="digit empty" id="dg5">•</div>
      </div>
      <div class="keys">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key fn" onclick="clearInput()">Clear</button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key fn" onclick="backspace()">⌫</button>
      </div>
      <div class="hint">6-digit code required</div>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <button class="btn" id="unlockBtn" onclick="tryUnlock()">Enter</button>

  <div class="tools" id="tools">
    <a class="tool-link" href="https://honestechmobilemechanic.com/ppi.html">
      <div class="tool-name">Pre-Purchase Inspection Tool</div>
      <div class="tool-desc">Full vehicle inspection checklist for PPI jobs</div>
    </a>
  </div>

  <footer>HonesTech Mobile Mechanic &middot; Middlesex County, NJ</footer>
</div>

<script>
  // Combination 1-35-15 entered as a 6-digit code: 01 35 15
  var CODE = "013515";
  var input = "";

  function render(){
    for(var i=0;i<6;i++){
      var el = document.getElementById('dg'+i);
      if(i < input.length){
        el.textContent = input[i];
        el.classList.remove('empty');
      } else {
        el.textContent = '•';
        el.classList.add('empty');
      }
    }
  }

  function press(d){
    if(input.length >= 6) return;
    input += d;
    document.getElementById('msg').textContent = '';
    document.getElementById('msg').className = 'msg';
    render();
  }

  function backspace(){
    input = input.slice(0, -1);
    render();
  }

  function clearInput(){
    input = "";
    render();
  }

  function tryUnlock(){
    var msg = document.getElementById('msg');

    if(input.length < 6){
      msg.textContent = 'Enter all 6 digits.';
      msg.className = 'msg';
      return;
    }

    if(input === CODE){
      msg.textContent = 'Access code correct.';
      msg.className = 'msg success';
      document.getElementById('lockStage').classList.add('unlocked');
      document.getElementById('unlockBtn').style.display = 'none';
      setTimeout(function(){
        document.getElementById('tools').classList.add('show');
      }, 300);
    } else {
      msg.textContent = 'Incorrect code. Try again.';
      msg.className = 'msg';
      var stage = document.getElementById('lockStage');
      stage.style.transform = 'translateX(-6px)';
      setTimeout(function(){ stage.style.transform = 'translateX(6px)'; }, 80);
      setTimeout(function(){ stage.style.transform = 'translateX(0)'; }, 160);
      setTimeout(function(){ input = ""; render(); }, 400);
    }
  }

  render();
</script>

</body>
</html>
